    post:
      tags:
      - Survival
      summary: 생존률 집계 1회 추가
      operationId: addSurvivalRate
      description: totalPlayers > 0, 0 <= survivors <= totalPlayers. 생존률은 survivors/totalPlayers*100으로 누적 계산한다.
        세션/라운드 ID나 멱등성 키가 없으므로 재전송 시 중복 누적된다.
