        '454':
          $ref: '#/components/responses/Error454'
        '500':
          $ref: '#/components/responses/Error500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSurvivalRateRequest'
    options:
