components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: GalaShow access token. Swagger Authorize에는 Bearer 접두사 없이 토큰 값만 입력한다. 현재 admin role 강제 검사는 없다.
  parameters:
    bannerId:
      name: bannerId
      in: path
      required: true
      description: C# int로 파싱하는 식별자. 서버는 양수 여부를 별도로 검증하지 않는다.
      schema:
        type: integer
        format: int32
    backId:
      name: backId
      in: path
      required: true
      description: C# int로 파싱하는 식별자. 서버는 양수 여부를 별도로 검증하지 않는다.
      schema:
        type: integer
        format: int32
    gameId:
      name: gameId
      in: path
      required: true
      description: C# int로 파싱하는 식별자. 서버는 양수 여부를 별도로 검증하지 않는다.
      schema:
        type: integer
        format: int32
  schemas:
    ApiError:
      type: object
      properties:
        code:
          type: string
          example: '443'
        message:
          type: string
          example: Access token expired
      required:
      - code
      - message
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: '443'
        error:
          $ref: '#/components/schemas/ApiError'
      required:
      - status
      - error
    EmptySuccess:
      type: object
      properties:
        status:
          type: string
          enum:
          - '200'
          example: '200'
      description: ApiResponse 성공 응답. status는 문자열이다. 데이터 없는 성공은 data를 생략한다.
      required:
      - status
    LoginRequest:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          example: streamer-example
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
      required:
      - id
      - password
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
          description: 직전 로그인/갱신에서 받은 최신 refresh token.
      required:
      - refreshToken
    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          nullable: true
          description: 생략 또는 빈 값이면 성공만 반환하고 서버 토큰을 폐기하지 않는다.
    TokenUser:
      type: object
      properties:
        id:
          type: string
        role:
          type: string
          description: 현재 로그인/갱신 구현의 역할 문자열. 관리자 역할 강제 검사는 별도 미구현.
      required:
      - id
      - role
    TokenBundle:
      type: object
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          format: int32
          description: access token 남은 수명, 초
        accessExpiresAt:
          type: string
          format: date-time
          example: '2026-09-29T00:00:00Z'
        refreshToken:
          type: string
        refreshExpiresIn:
          type: integer
          format: int32
          description: refresh token 남은 수명, 초
        refreshExpiresAt:
          type: string
          format: date-time
          example: '2026-09-29T00:00:00Z'
        user:
          $ref: '#/components/schemas/TokenUser'
      required:
      - accessToken
      - expiresIn
      - accessExpiresAt
      - refreshToken
      - refreshExpiresIn
      - refreshExpiresAt
      - user
    TokenSuccess:
      type: object
      properties:
        status:
          type: string
          enum:
          - '200'
          example: '200'
        data:
          $ref: '#/components/schemas/TokenBundle'
      description: ApiResponse 성공 응답. status는 문자열이다. 데이터 없는 성공은 data를 생략한다.
      required:
      - status
      - data
    VerifyData:
      type: object
      properties:
        sub:
          type: string
          nullable: true
        role:
          type: string
          nullable: true
        exp:
          type: string
          nullable: true
          description: JWT exp claim 문자열, Unix epoch 초
        valid:
          type: boolean
      required:
      - sub
      - role
      - exp
      - valid
    VerifySuccess:
      type: object
      properties:
        status:
          type: string
          enum:
          - '200'
