# 현재 구현 기준. 사용 안내: swagger.md
openapi: 3.0.3
info:
  title: GALASHOW Backend API
  version: '2026-09-29'
  description: 'API 기준 커밋 2779546 및 2026-09-29 로컬 환경변수/CORS/OPTIONS 변경과 현재 SAM을 확인하여 작성한 Swagger/OpenAPI 문서. 제품 요구사항이나
    미래 API 설계가 아니다.


    일반 응답은 status(문자열)/data/error이며 데이터 없는 성공은 {"status":"200"}. 인증은 엔드포인트별 Bearer JWT이며 미니게임·아바타 GET도 인증이 필요하다.
    현재 write API는 JWT 유효성만 확인하고 admin 역할은 강제하지 않는다. 토큰 만료 443 등 코드의 비표준 HTTP 상태를 그대로 기록했다.


    실제 서비스 로그인은 개발 계정 외 미구현이다. 업무 API 호출에는 환경에 맞는 DB/AWS 설정이 필요하다. 성공 예시는 형식 예시이며 운영 동작 검증이 아니다. 잘못된 JSON/타입은 공통
    catch에서 500이 될 수 있다. 업무 API의 AppBootstrap 초기화 오류는 핸들러 try 밖에서 발생해 API Gateway 오류가 될 수 있다.


    방·세션·참가자·라운드 결과 API는 아직 없으며 포함하지 않았다. SAM ANY catch-all은 지원 메서드를 operation으로 표시한다.'
servers:
- url: http://127.0.0.1:3000
  description: SAM local 예시 주소. 서버를 자동 실행하지 않으며 DB/AWS 설정 준비가 필요하다.
- url: '{baseUrl}'
  description: 사용자가 지정하는 실제 API base URL. 문서 서버 주소와 구분한다.
  variables:
    baseUrl:
      default: https://api.example.invalid
      description: 환경의 실제 custom domain 또는 API Gateway URL(필요하면 /dev, /prod 포함)로 바꾼다. 확인되지 않은 운영 주소는 넣지 않았다.
tags:
- name: Auth
  description: 로그인·갱신·로그아웃·검증
- name: Banners
  description: 배너
- name: Background
  description: 배경
- name: Policies
  description: 정책 문서 링크
- name: SNS
  description: SNS 링크
- name: Minigames
  description: 미니게임 카탈로그
- name: Survival
  description: 게임별 생존률 집계
- name: Avatars
  description: 시청자 아바타
- name: CORS
  description: SAM에 등록된 OPTIONS
- name: Routing
  description: SAM catch-all 미지원 경로의 현재 응답
paths:
  /auth/login:
    post:
      tags:
      - Auth
      summary: 로그인 및 토큰 발급
      operationId: login
      description: 현재 ValidateCredentialAsync는 개발 환경 고정 계정 외의 실제 계정 로그인이 미구현이다. 성공하면 access/refresh token을 함께 반환한다.
        비밀값은 예시에 포함하지 않는다.
      security: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenSuccess'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '440':
          $ref: '#/components/responses/Error440'
        '500':
          $ref: '#/components/responses/Error500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
    options:
      tags:
      - CORS
      summary: 'CORS 사전 요청: /auth/login'
      operationId: preflight1
      security: []
      responses:
        '200':
          $ref: '#/components/responses/CorsSuccess'
  /auth/refresh:
    post:
      tags:
      - Auth
      summary: 토큰 갱신 및 refresh token 교체
      operationId: refreshTokens
      description: 기존 refresh token을 폐기하고 새 access/refresh token을 반환한다. 클라이언트는 두 토큰을 모두 교체해야 한다. 본문/토큰 누락은 401.
        역할 조회 실패 시 user 역할로 fallback한다.
      security: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenSuccess'
        '401':
          $ref: '#/components/responses/Error401'
        '444':
          $ref: '#/components/responses/Error444'
        '445':
          $ref: '#/components/responses/Error445'
        '446':
          $ref: '#/components/responses/Error446'
        '500':
          $ref: '#/components/responses/Error500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
    options:
      tags:
      - CORS
      summary: 'CORS 사전 요청: /auth/refresh'
      operationId: preflight2
      security: []
      responses:
        '200':
          $ref: '#/components/responses/CorsSuccess'
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Refresh token 폐기
      operationId: logout
      description: Bearer 인증 없이 본문 refreshToken을 폐기한다. 본문/토큰이 없으면 폐기 없이 성공한다. 이미 발급된 access token을 즉시 폐기하는 기능은 아니다.
      security: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccess'
              example:
                status: '200'
        '500':
          $ref: '#/components/responses/Error500'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
    options:
      tags:
      - CORS
      summary: 'CORS 사전 요청: /auth/logout'
      operationId: preflight3
      security: []
      responses:
        '200':
          $ref: '#/components/responses/CorsSuccess'
  /auth/verify:
    get:
      tags:
      - Auth
      summary: Access token 검증
      operationId: verifyToken
      description: 일반 RequireAuthThen 개발용 테스트 토큰 우회를 사용하지 않고 JWT를 직접 검증한다. 누락 441, 유효하지 않음 442, 만료 443.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifySuccess'
        '401':
          $ref: '#/components/responses/Error401'
        '441':
          $ref: '#/components/responses/Error441'
        '442':
          $ref: '#/components/responses/Error442'
        '443':
          $ref: '#/components/responses/Error443'
        '500':
          $ref: '#/components/responses/Error500'
    options:
      tags:
      - CORS
      summary: 'CORS 사전 요청: /auth/verify'
      operationId: preflight4
      security: []
      responses:
        '200':
          $ref: '#/components/responses/CorsSuccess'
  /banners:
    get:
      tags:
      - Banners
      summary: 배너 목록 조회
      operationId: listBanners
      description: 현재 핸들러는 배너가 10개 미만이면 450을 반환한다. DB v002 마이그레이션은 누락된 ID 1~10의 빈 문구 슬롯을 추가하고 기존 문구와 정렬은 보존한다. Client는 빈 문구를 표시하지 않는다. 실제 응답 필드는 id/message/order이며 imageUrl이 아니다.
      security: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BannerListSuccess'
        '401':
          $ref: '#/components/responses/Error401'
        '450':
          $ref: '#/components/responses/Error450'
        '500':
          $ref: '#/components/responses/Error500'
    options:
      tags:
      - CORS
      summary: 'CORS 사전 요청: /banners'
      operationId: preflight5
      security: []
      responses:
        '200':
          $ref: '#/components/responses/CorsSuccess'
  /banners/{bannerId}:
    parameters:
    - $ref: '#/components/parameters/bannerId'
    put:
      tags:
      - Banners
      summary: 배너 메시지 수정
      operationId: updateBanner
      description: message를 변경한다. bannerId 파싱 실패는 540, 변경 행이 0이면 450. 현재 admin role을 검사하지 않는다.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccess'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '443':
          $ref: '#/components/responses/Error443'
        '450':
          $ref: '#/components/responses/Error450'
        '500':
          $ref: '#/components/responses/Error500'
        '540':
          $ref: '#/components/responses/Error540'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBannerRequest'
    options:
      tags:
      - CORS
      summary: 'CORS 사전 요청: /banners/{bannerId}'
      operationId: preflight6
      security: []
      responses:
        '200':
          $ref: '#/components/responses/CorsSuccess'
  /background:
    get:
      tags:
      - Background
      summary: 배경 목록 조회
      operationId: listBackgrounds
      description: 배경이 3개 미만이면 451을 반환한다.
      security: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackgroundListSuccess'
        '401':
          $ref: '#/components/responses/Error401'
        '451':
          $ref: '#/components/responses/Error451'
        '500':
          $ref: '#/components/responses/Error500'
    options:
      tags:
      - CORS
      summary: 'CORS 사전 요청: /background'
      operationId: preflight7
      security: []
      responses:
        '200':
          $ref: '#/components/responses/CorsSuccess'
  /background/{backId}:
    parameters:
    - $ref: '#/components/parameters/backId'
    put:
      tags:
      - Background
      summary: 배경 제목·타입·URL 수정
      operationId: updateBackground
      description: title과 url은 공백일 수 없다. type enum이나 URL 형식 검증은 없다. ID 파싱 실패/변경 행 없음은 451.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccess'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '443':
          $ref: '#/components/responses/Error443'
        '451':
          $ref: '#/components/responses/Error451'
        '500':
          $ref: '#/components/responses/Error500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBackgroundRequest'
    options:
      tags:
      - CORS
      summary: 'CORS 사전 요청: /background/{backId}'
      operationId: preflight8
      security: []
      responses:
        '200':
          $ref: '#/components/responses/CorsSuccess'
  /policies:
    get:
      tags:
      - Policies
      summary: 이용약관·개인정보처리방침 조회
      operationId: getPolicies
      description: 문서 URL을 반환하며 DB 행이 없으면 두 필드는 빈 문자열이다.
      security: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicySuccess'
        '401':
          $ref: '#/components/responses/Error401'
        '500':
          $ref: '#/components/responses/Error500'
    put:
      tags:
      - Policies
      summary: 정책 문서 URL 수정
      operationId: updatePolicies
      description: 앞뒤 공백을 제거한다. 본문 누락/null 또는 빈 필드도 현재는 452로 응답한다.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccess'
        '401':
          $ref: '#/components/responses/Error401'
        '443':
          $ref: '#/components/responses/Error443'
        '452':
          $ref: '#/components/responses/Error452'
        '500':
          $ref: '#/components/responses/Error500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePolicyRequest'
    options:
      tags:
      - CORS
      summary: 'CORS 사전 요청: /policies'
      operationId: preflight9
      security: []
      responses:
        '200':
          $ref: '#/components/responses/CorsSuccess'
  /sns-links:
    get:
      tags:
      - SNS
      summary: SNS 링크 목록 조회
      operationId: listSnsLinks
      description: 응답 모델에는 id가 없고 title/url/iconUrl/order만 있다.
      security: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnsListSuccess'
        '401':
          $ref: '#/components/responses/Error401'
        '500':
          $ref: '#/components/responses/Error500'
    put:
      tags:
      - SNS
      summary: SNS 링크 전체 교체
      operationId: replaceSnsLinks
      description: 기존 목록을 교체한다. 본문 누락은 453, null 객체/빈 배열은 543. 항목 title/url 공백은 서비스 예외로 500이 될 수 있다. 현재 GET에는 없는
        id를 PUT은 입력받는다.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccess'
        '401':
          $ref: '#/components/responses/Error401'
        '443':
          $ref: '#/components/responses/Error443'
        '453':
          $ref: '#/components/responses/Error453'
        '500':
          $ref: '#/components/responses/Error500'
        '543':
          $ref: '#/components/responses/Error543'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSnsLinksRequest'
    options:
      tags:
      - CORS
      summary: 'CORS 사전 요청: /sns-links'
      operationId: preflight10
      security: []
      responses:
        '200':
          $ref: '#/components/responses/CorsSuccess'
  /minigames:
    get:
      tags:
      - Minigames
      summary: 미니게임 목록 및 태그 조회
      operationId: listMinigames
      description: 각 필터는 쉼표로 구분된 문자열을 받는다. 페이지네이션 없음. 현재 다종 태그 필터를 함께 쓰면 단일 JOIN 행에 AND 조건이 적용되어 예상과 달리 빈 결과가 될
        수 있다.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MinigameListSuccess'
              example:
                status: '200'
                data:
                  total: 0
                  items: []
        '401':
          $ref: '#/components/responses/Error401'
        '443':
          $ref: '#/components/responses/Error443'
        '500':
          $ref: '#/components/responses/Error500'
      parameters:
      - name: scale
        in: query
        required: false
        description: 규모 태그. enum 서버 검증 없음.
        schema:
          type: string
        example: medium
      - name: difficulty
        in: query
        required: false
        description: 난이도 태그.
        schema:
          type: string
        example: 1,2
      - name: round
        in: query
        required: false
        description: 라운드 태그.
        schema:
          type: string
        example: 1-2
      - name: type
        in: query
        required: false
        description: 게임 유형 태그.
        schema:
          type: string
        example: choice,strategy
      - name: survivalRate
        in: query
        required: false
        description: 생존률 태그.
        schema:
          type: string
        example: medium
      - name: winCondition
        in: query
        required: false
        description: 승리 조건 태그.
        schema:
          type: string
        example: first
    post:
      tags:
      - Minigames
      summary: 미니게임 생성
      operationId: createMinigame
      description: name 필수·중복 이름은 455. 생성 성공은 201이 아니라 현재 HTTP 200. DB 생성 실패는 544. enabled/pluginId 필드는 아직 없다.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MinigameCreatedSuccess'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '443':
          $ref: '#/components/responses/Error443'
        '455':
          $ref: '#/components/responses/Error455'
        '500':
          $ref: '#/components/responses/Error500'
        '544':
          $ref: '#/components/responses/Error544'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MinigameWriteRequest'
    options:
      tags:
      - CORS
      summary: 'CORS 사전 요청: /minigames'
      operationId: preflight11
      security: []
      responses:
        '200':
          $ref: '#/components/responses/CorsSuccess'
  /minigames/{gameId}:
    parameters:
    - $ref: '#/components/parameters/gameId'
    get:
      tags:
      - Minigames
      summary: 미니게임 상세 조회
      operationId: getMinigame
      description: ''
      security:
      - BearerAuth: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MinigameDetailSuccess'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '443':
          $ref: '#/components/responses/Error443'
        '454':
          $ref: '#/components/responses/Error454'
        '500':
          $ref: '#/components/responses/Error500'
    put:
      tags:
      - Minigames
      summary: 미니게임 전체 정보 수정
      operationId: updateMinigame
      description: 부분 PATCH가 아니다. 생략한 목록·문자열이 기본값으로 교체될 수 있다.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MinigameUpdatedSuccess'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '443':
          $ref: '#/components/responses/Error443'
        '454':
          $ref: '#/components/responses/Error454'
        '455':
          $ref: '#/components/responses/Error455'
        '500':
          $ref: '#/components/responses/Error500'
        '545':
          $ref: '#/components/responses/Error545'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MinigameWriteRequest'
    delete:
      tags:
      - Minigames
      summary: 미니게임 삭제
      operationId: deleteMinigame
      description: 미존재/삭제 행 0은 454. 현재 라우트에서 세션 기록 연결이나 사용 중 검사 456을 호출하지 않는다.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccess'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '443':
          $ref: '#/components/responses/Error443'
        '454':
          $ref: '#/components/responses/Error454'
        '500':
          $ref: '#/components/responses/Error500'
    options:
      tags:
      - CORS
