            example: 'true'
        Access-Control-Allow-Headers:
          schema:
            type: string
            example: Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token
        Access-Control-Allow-Methods:
          schema:
            type: string
            example: GET,POST,PUT,DELETE,OPTIONS
        Vary:
          description: Origin에 따라 응답 헤더가 달라짐. 기존 Vary 값이 있으면 Origin을 추가한다.
          schema:
            type: string
          example: Origin
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmptySuccess'
          example:
            status: '200'
