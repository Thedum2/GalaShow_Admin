    put:
      tags:
      - Survival
      summary: 생존률 집계 수동 수정
      operationId: updateSurvivalRate
      description: 관리 용도지만 현재 admin role 검사는 없다. 집계 3개 정수의 음수만 거부한다. 비율 범위/비율과 인원 일치/생존자가 총원 이내인지 검증하지 않는다.
      security:
